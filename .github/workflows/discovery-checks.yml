name: Public discovery and read-only MCP checks
on:
  push:
    branches: [main, docs/agent-discovery-geo-20261125]
    paths:
      - 'docs/**'
      - 'llms.txt'
      - 'skills/**'
      - 'mcp_server/**'
      - 'tests/test_discovery.py'
      - '.github/workflows/discovery-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_discovery.py -v
      - run: python -m pip install -r mcp_server/requirements.txt
      - run: python -m pip show mcp
      - run: python mcp_server/test_protocol.py
